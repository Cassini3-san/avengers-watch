name: Cinematica watch

on:
  schedule:
    # Каждые 5 минут. Время в GitHub всегда UTC (Ташкент = UTC+5).
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      ping:
        description: "Отправить тестовое сообщение в Telegram"
        type: boolean
        default: false

concurrency:
  group: cinematica-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test ping
        if: ${{ inputs.ping }}
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          code=$(curl -s -o /tmp/tg.json -w "%{http_code}" \
            "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT" \
            --data-urlencode "text=Proverka svyazi: GitHub Actions pishet v etot chat. Slezhenie za Mstitelyami nastroeno.")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "Telegram otvetil oshibkoy:"
            cat /tmp/tg.json
            exit 1
          fi
          echo "Soobshchenie dostavleno."

      - name: Proverka repertuara
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          WATCH_URL: https://cinematica.uz/api/v1/repertory/movie/995/grouped
          WATCH_PAGE: https://cinematica.uz/movies/995
        run: python check.py
