name: Cinematica watch

on:
  schedule:
    # Каждые 5 минут. Время в GitHub всегда UTC (Ташкент = UTC+5).
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: cinematica-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Proverka repertuara
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          WATCH_URL: https://cinematica.uz/api/v1/repertory/movie/995/grouped
          WATCH_PAGE: https://cinematica.uz/movies/995
        run: python check.py
